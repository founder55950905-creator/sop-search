<!DOCTYPE html>

<style>

  .topbar { background: #1C2126; padding: 16px 20px 14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .topbar .eyebrow { font-size: 11px; letter-spacing: 2px; color: #8A94A0; margin-bottom: 4px; }
  .topbar h1 { font-size: 18px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.5px; }
  .lang-switch { display:flex; background:#2A313A; border-radius:8px; overflow:hidden; flex-shrink:0; }
  .lang-btn { padding:6px 10px; font-size:12px; color:#8A94A0; background:transparent; border:none; cursor:pointer; font-weight:600; }

  .tabs { display:flex; background:#FFFFFF; border-bottom: 1px solid #E4E7EB; }

  .tab.active { color:#1C2126; border-bottom-color:#F5A623; }

  .panel { display:none; }
  .panel.active { display:block; }

  .search-wrap { padding: 18px 20px 8px; background: #FFFFFF; }
  .search-label { font-size: 12px; color: #6B7684; margin-bottom: 8px; }
  .search-box { display: flex; align-items: center; background: #F1F3F5; border: 2px solid #F5A623; border-radius: 10px; padding: 14px; }
  .search-box svg { flex-shrink: 0; margin-right: 8px; }
  #searchInput { border: none; background: transparent; outline: none; font-size: 18px; width: 100%; letter-spacing: 0.5px; color: #1C2126; }
  #searchInput::placeholder { color: #A2ABB5; }
  .hint { font-size: 11.5px; color: #9AA3AC; padding: 8px 20px 10px; background: #FFFFFF; }
  .code-table-toggle { font-size: 12px; color: #F5A623; padding: 0 20px 12px; background: #FFFFFF; cursor: pointer; text-decoration: underline; }
  .code-table { display: none; padding: 4px 20px 14px; background: #FBFBFC; border-bottom: 1px solid #E4E7EB; }
  .code-table.open { display: block; }
  .code-table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .code-table td { padding: 4px 6px; border-bottom: 1px solid #EEE; }
  .code-table td:last-child { font-weight: 700; color: #F5A623; text-align: right; }

  .results { padding: 6px 0 10px; max-height: 440px; overflow-y: auto; }
  .result-item { display: flex; justify-content: space-between; align-items: center; padding: 17px 20px; border-bottom: 1px solid #F0F1F3; cursor: pointer; min-height: 60px; }
  .result-item:active { background: #FFF7EB; }
  .result-left { flex: 1; min-width: 0; }
  .result-code { font-size: 11px; color: #F5A623; font-weight: 700; letter-spacing: 0.5px; font-family: "SF Mono", Consolas, monospace; }
  .result-name { font-size: 15px; font-weight: 600; color: #1C2126; margin-top: 2px; }
  .result-meta { font-size: 12px; color: #8A94A0; margin-top: 3px; }
  .result-meta .vendor { display: inline-block; background: #EEF1F4; padding: 1px 7px; border-radius: 4px; margin-right: 6px; color: #5A6572; }
  .result-meta .ng { background:#FDECEC; color:#C24242; }
  .arrow { color: #C6CBD1; margin-left: 10px; flex-shrink: 0; }
  .no-result { padding: 40px 20px; text-align: center; color: #A2ABB5; font-size: 13px; }
  .empty-state { padding: 30px 20px 10px; text-align: center; }
  .empty-state .big-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.5; }
  .empty-state p { font-size: 13px; color: #9AA3AC; line-height: 1.6; }
  .loading-state { padding: 50px 20px; text-align: center; color: #9AA3AC; font-size: 13px; }
  .error-state { padding: 30px 20px; text-align: center; color: #C24242; font-size: 13px; line-height: 1.6; }

  /* Browse mode */
  .crumb { display:flex; align-items:center; gap:6px; padding:14px 20px 4px; font-size:12.5px; color:#8A94A0; background:#FFFFFF; flex-wrap:wrap; }
  .crumb span.clickable { color:#F5A623; cursor:pointer; font-weight:600; }
  .browse-list { padding: 4px 0 10px; max-height: 480px; overflow-y:auto; }
  .browse-item { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #F0F1F3; cursor:pointer; min-height:56px; }
  .browse-item:active { background:#FFF7EB; }
  .browse-item .label { font-size:15px; font-weight:600; color:#1C2126; }
  .browse-item .sub { font-size:12px; color:#9AA3AC; margin-top:2px; }

  /* NG回報表單 */
  .ng-form { padding: 18px 20px 24px; }

  .ng-field input[type="text"], .ng-field select, .ng-field textarea {

<p style="text-align:center;font-size:12.5px;color:#8A94A0;margin-top:18px;line-height:1.7;max-width:420px;margin-left:auto;margin-right:auto;">

<script>
/* ===================== 這裡放你的 Google Sheet 發佈CSV連結 ===================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIOrCL6G3FWG1wZvKYQHp1G9gu_E4QH9XyHt5r3sN7P3ap-nVR7Fz2mtT1zelamK4Ki8xibr747snh/pub?output=csv";

/* ===================== NG回報 Apps Script Web App 網址 ===================== */
const NG_REPORT_URL = "https://script.google.com/macros/s/AKfycbxL3Ldt4amqkcuz3d24UPuRgFwdV6tcU-EWKRSpvwnoQTMvvCBh7KdVsgsQ39TfcAU-Ag/exec";

/* ===================== 語言包 ===================== */
const I18N = {
  zh: {

    tabSearch: "快速查詢", tabBrowse: "瀏覽選單",
    searchLabel: "輸入工單上的料號＋製程代碼",
    hint: "格式：料號-製程代碼，例如 -311。NG 請輸入「料號-NG」",
    toggleCodesOpen: "查看製程代碼對照表 ▾", toggleCodesClose: "收起製程代碼對照表 ▴",

    loading: "資料載入中…", loadError: "資料載入失敗，請確認網路連線或稍後再試",
    tabNg: "NG回報", ngMatCode: "料號", ngProcess: "製程", ngTypeLabel: "異常類型",
    ngNote: "備註（選填）", ngPhoto: "拍照上傳", ngPhotoHint: "點此拍照或選擇照片",
    ngSubmit: "送出回報", ngSubmitting: "送出中…",

    ngErrorTitle: "送出失敗", ngErrorDesc: "請檢查網路連線後再試一次",
    ngAgain: "再回報一筆", ngNeedMatCode: "請輸入料號"
  },
  th: {

    tabSearch: "ค้นหาด่วน", tabBrowse: "เมนูเรียกดู",
    searchLabel: "กรอกรหัสสินค้า + รหัสกระบวนการ",
    hint: "รูปแบบ: รหัสสินค้า-รหัสกระบวนการ เช่น -311 / NG พิมพ์ -NG",
    toggleCodesOpen: "ดูตารางรหัสกระบวนการ ▾", toggleCodesClose: "ซ่อนตารางรหัสกระบวนการ ▴",
    placeholder: "11C037800900-311",
    emptyDefault: "กรอก \"รหัสสินค้า-รหัสกระบวนการ\"<br>หากพบผลลัพธ์เดียวจะเปิดหน้าทันที",
    noResult: "ไม่พบรหัสสินค้า/รหัสกระบวนการที่ตรงกัน กรุณาตรวจสอบอีกครั้ง",
    locked: (name, page) => `เลือกแล้ว: ${name}－${page}<br>กำลังเปิดหน้าขั้นตอนนี้…`,
    chooseVendor: "เลือกผู้ผลิต", back: "‹ ย้อนกลับ", home: "หน้าแรก", ngLabel: "การจัดการของเสีย (NG)",
    loading: "กำลังโหลดข้อมูล…", loadError: "โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตหรือลองใหม่",
    tabNg: "รายงานของเสีย", ngMatCode: "รหัสสินค้า", ngProcess: "กระบวนการ", ngTypeLabel: "ประเภทความผิดปกติ",
    ngNote: "หมายเหตุ (ไม่บังคับ)", ngPhoto: "ถ่ายภาพ/อัปโหลด", ngPhotoHint: "แตะเพื่อถ่ายภาพหรือเลือกรูป",
    ngSubmit: "ส่งรายงาน", ngSubmitting: "กำลังส่ง…",
    ngSuccessTitle: "ส่งสำเร็จ", ngSuccessDesc: "ได้รับรายงานของเสียแล้ว ขอบคุณค่ะ",
    ngErrorTitle: "ส่งไม่สำเร็จ", ngErrorDesc: "กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่",
    ngAgain: "รายงานอีกครั้ง", ngNeedMatCode: "กรุณากรอกรหัสสินค้า"
  }
};
let currentLang = 'zh';

const PROC_NAMES = {
  zh: { "102":"鑄造","311":"鋸切","312":"雷切鋸切","313":"鋸切內","314":"鋸切外","310":"研磨","604":"校正","503":"噴砂","218":"焊補","605":"去毛邊","602":"檢驗＋包裝","603":"檢驗TO加工","606":"漏測","351":"退砂","352":"T4 熱處理","353":"T5 熱處理" },
  th: { "102":"หล่อขึ้นรูป","311":"ตัด","312":"ตัดเลเซอร์","313":"ตัดด้านใน","314":"ตัดด้านนอก","310":"ขัด","604":"ปรับแนว","503":"พ่นทราย","218":"เชื่อมซ่อม","605":"ลบคม","602":"ตรวจสอบ+บรรจุ","603":"ตรวจสอบก่อนเข้าเครื่อง","606":"ทดสอบรั่วซึม","351":"ขจัดทราย","352":"อบชุบ T4","353":"อบชุบ T5" }
};

/* NG異常類型：value為固定寫入Sheet的值(保持中文，避免同一欄位中泰文混雜難以統計)，顯示文字依語言切換 */
const NG_TYPES = [
  { value: "鑄缺", zh: "鑄缺", th: "หล่อบกพร่อง" },
  { value: "鋁水不足", zh: "鋁水不足", th: "น้ำอลูมิเนียมไม่พอ" },
  { value: "鋸切不良", zh: "鋸切不良", th: "ตัดไม่ได้มาตรฐาน" },
  { value: "收縮", zh: "收縮", th: "การหดตัว" },
  { value: "夾渣", zh: "夾渣", th: "สิ่งเจือปน" },
  { value: "毛邊過大", zh: "毛邊過大", th: "ครีบเกินขนาด" },
  { value: "尺寸異常", zh: "尺寸異常", th: "ขนาดผิดปกติ" },
  { value: "其他", zh: "其他", th: "อื่นๆ" }
];

/* ===================== 資料狀態 ===================== */
let DATA = [];       // 展平後的查詢用資料
let VENDORS = {};    // 瀏覽模式用: vendor -> [{code,name,pages:[{page,url,procCode}]}]
let dataLoaded = false;
let dataError = false;

function csvParse(text) {
  // 簡單CSV解析,處理逗號分隔與雙引號
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function loadData() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = csvParse(text).filter(r => r.length > 1 && r[0]);
    const header = rows[0];
    const idx = {
      vendor: header.indexOf('廠商'), code: header.indexOf('料號'),
      name: header.indexOf('品名'), procCode: header.indexOf('製程代碼'),
      page: header.indexOf('對應頁面'), url: header.indexOf('網址')
    };
    DATA = [];
    VENDORS = {};
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r[idx.code]) continue;
      const item = {
        vendor: r[idx.vendor], matCode: r[idx.code], name: r[idx.name],
        procCode: r[idx.procCode], pageLabel: r[idx.page], url: r[idx.url]
      };
      DATA.push(item);
      if (!VENDORS[item.vendor]) VENDORS[item.vendor] = {};
      if (!VENDORS[item.vendor][item.matCode]) {
        VENDORS[item.vendor][item.matCode] = { name: item.name, pages: [] };
      }
      VENDORS[item.vendor][item.matCode].pages.push(item);
    }
    dataLoaded = true;
  } catch (e) {
    dataError = true;
  }
}

/* ===================== 搜尋模式邏輯 ===================== */
const input = document.getElementById('searchInput');
const results = document.getElementById('results');
const toggle = document.getElementById('toggleCodes');
const codeTable = document.getElementById('codeTable');

function renderCodeTable() {
  const names = PROC_NAMES[currentLang];
  const rows = Object.keys(names).map(code => `<tr><td>${names[code]}</td><td>${code}</td></tr>`).join('');
  document.getElementById('codeTableBody').innerHTML = rows;
}

toggle.addEventListener('click', () => {
  codeTable.classList.toggle('open');
  toggle.textContent = codeTable.classList.contains('open') ? I18N[currentLang].toggleCodesClose : I18N[currentLang].toggleCodesOpen;
});

function parseQuery(raw) {
  const cleaned = raw.trim();
  const ngMatch = cleaned.match(/^([A-Za-z0-9]+)[\s\-]*NG$/i);
  if (ngMatch) return { code: ngMatch[1].toLowerCase(), proc: 'NG' };
  const m = cleaned.match(/^([A-Za-z0-9]+)[\s\-]*([0-9]{2,4})?$/);
  if (!m) return { code: cleaned.toLowerCase(), proc: '' };
  return { code: (m[1] || '').toLowerCase(), proc: (m[2] || '') };
}

function jumpTo(item) {
  const t = I18N[currentLang];
  results.innerHTML = `<div class="empty-state"><div class="big-icon">✅</div><p><b style="color:#1C2126">${t.locked(item.name, item.pageLabel)}</b></p></div>`;
  window.location.href = item.url;
}

function render(list) {
  const t = I18N[currentLang];
  if (list.length === 0) { results.innerHTML = `<div class="no-result">${t.noResult}</div>`; return; }
  if (list.length === 1) { jumpTo(list[0]); return; }
  results.innerHTML = list.map(item => `
    <div class="result-item" data-url="${item.url}">
      <div class="result-left">
        <div class="result-code">${item.matCode} · ${item.procCode}</div>
        <div class="result-name">${item.name}</div>
        <div class="result-meta"><span class="vendor${item.procCode==='NG' ? ' ng':''}">${item.vendor}</span>${item.pageLabel}</div>
      </div>
      <div class="arrow">›</div>
    </div>`).join('');
}

results.addEventListener('click', (e) => {
  const el = e.target.closest('[data-url]');
  if (el) window.location.href = el.dataset.url;
});

function showEmptyState() {
  if (!dataLoaded && !dataError) { results.innerHTML = `<div class="loading-state">${I18N[currentLang].loading}</div>`; return; }
  if (dataError) { results.innerHTML = `<div class="error-state">${I18N[currentLang].loadError}</div>`; return; }
  results.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><p>${I18N[currentLang].emptyDefault}</p></div>`;
}

input.addEventListener('input', () => {
  const raw = input.value.trim();
  if (raw === '') { showEmptyState(); return; }
  const query = parseQuery(raw);
  const filtered = DATA.filter(item => {
    const codeMatch = item.matCode.toLowerCase().includes(query.code);
    const procMatch = query.proc ? item.procCode === query.proc : true;
    return codeMatch && procMatch;
  });
  render(filtered);
});

/* ===================== 瀏覽模式邏輯 ===================== */
const crumbEl = document.getElementById('crumb');
const browseListEl = document.getElementById('browseList');
let browseState = { level: 'vendor', vendor: null, matCode: null };

function renderBrowse() {
  const t = I18N[currentLang];
  let crumbHTML = `<span class="clickable" data-nav="home">${t.home}</span>`;
  if (browseState.vendor) crumbHTML += ` › <span class="${browseState.matCode ? 'clickable' : ''}" data-nav="vendor">${browseState.vendor}</span>`;
  if (browseState.matCode) crumbHTML += ` › <span>${VENDORS[browseState.vendor][browseState.matCode].name}</span>`;
  crumbEl.innerHTML = crumbHTML;

  if (!dataLoaded && !dataError) { browseListEl.innerHTML = `<div class="loading-state">${t.loading}</div>`; return; }
  if (dataError) { browseListEl.innerHTML = `<div class="error-state">${t.loadError}</div>`; return; }

  if (browseState.level === 'vendor') {
    browseListEl.innerHTML = Object.keys(VENDORS).map(v => `
      <div class="browse-item" data-nav="toVendor" data-vendor="${v}">
        <div><div class="label">${v}</div><div class="sub">${Object.keys(VENDORS[v]).length} 項產品</div></div>
        <div class="arrow">›</div>
      </div>`).join('');
  } else if (browseState.level === 'product') {
    const products = VENDORS[browseState.vendor];
    browseListEl.innerHTML = Object.keys(products).map(code => `
      <div class="browse-item" data-nav="toProduct" data-code="${code}">
        <div><div class="label">${products[code].name}</div><div class="sub">${code}</div></div>
        <div class="arrow">›</div>
      </div>`).join('');
  } else if (browseState.level === 'process') {
    const names = PROC_NAMES[currentLang];
    const product = VENDORS[browseState.vendor][browseState.matCode];
    browseListEl.innerHTML = product.pages.map(p => `
      <div class="browse-item" data-nav="toPage" data-url="${p.url}">
        <div><div class="label ${p.procCode==='NG' ? 'ng-tag':''}">${p.pageLabel}</div><div class="sub">${p.procCode==='NG' ? t.ngLabel : (names[p.procCode]||p.procCode)}</div></div>
        <div class="arrow">›</div>
      </div>`).join('');
  }
}

browseListEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-nav]');
  if (!el) return;
  const nav = el.dataset.nav;
  if (nav === 'toVendor') { browseState = { level:'product', vendor: el.dataset.vendor, matCode:null }; }
  else if (nav === 'toProduct') { browseState = { level:'process', vendor: browseState.vendor, matCode: el.dataset.code }; }
  else if (nav === 'toPage') { window.location.href = el.dataset.url; return; }
  renderBrowse();
});

crumbEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-nav]');
  if (!el) return;
  if (el.dataset.nav === 'home') browseState = { level:'vendor', vendor:null, matCode:null };
  else if (el.dataset.nav === 'vendor') browseState = { level:'product', vendor: browseState.vendor, matCode:null };
  renderBrowse();
});

/* ===================== Tab 切換 ===================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

/* ===================== NG回報邏輯 ===================== */
let ngPhotoBase64 = '';

function populateNgProcessOptions() {
  const select = document.getElementById('ngProcess');
  const names = PROC_NAMES[currentLang];
  select.innerHTML = Object.keys(names).map(code => `<option value="${names[code]}">${names[code]}</option>`).join('')
    + `<option value="NG">NG</option>`;
}

function populateNgTypeOptions() {
  const select = document.getElementById('ngType');
  select.innerHTML = NG_TYPES.map(t => `<option value="${t.value}">${t[currentLang]}</option>`).join('');
}

document.getElementById('ngPhotoBox').addEventListener('click', () => {
  document.getElementById('ngPhotoInput').click();
});

document.getElementById('ngPhotoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    ngPhotoBase64 = ev.target.result;
    const box = document.getElementById('ngPhotoBox');
    box.classList.add('has-photo');
    box.innerHTML = `<img src="${ngPhotoBase64}">`;
  };
  reader.readAsDataURL(file);
});

document.getElementById('ngSubmitBtn').addEventListener('click', async () => {
  const t = I18N[currentLang];
  const matCode = document.getElementById('ngMatCode').value.trim();
  const process = document.getElementById('ngProcess').value;
  const ngType = document.getElementById('ngType').value;
  const note = document.getElementById('ngNote').value.trim();

  if (!matCode) {
    alert(t.ngNeedMatCode);
    return;
  }

  const btn = document.getElementById('ngSubmitBtn');
  btn.disabled = true;
  btn.textContent = t.ngSubmitting;

  try {
    await fetch(NG_REPORT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ matCode, process, ngType, note, photoBase64: ngPhotoBase64 })
    });

    document.getElementById('ngFormWrap').style.display = 'none';
    const statusEl = document.getElementById('ngStatus');
    statusEl.style.display = 'block';
    statusEl.innerHTML = `
      <div class="big-icon">✅</div>
      <p><b style="color:#1C2126">${t.ngSuccessTitle}</b><br>${t.ngSuccessDesc}</p>
      <button class="ng-submit-btn" id="ngAgainBtn" style="margin-top:14px;">${t.ngAgain}</button>
    `;
    document.getElementById('ngAgainBtn').addEventListener('click', resetNgForm);
  } catch (err) {
    document.getElementById('ngFormWrap').style.display = 'none';
    const statusEl = document.getElementById('ngStatus');
    statusEl.style.display = 'block';
    statusEl.innerHTML = `
      <div class="big-icon">⚠️</div>
      <p><b style="color:#C24242">${t.ngErrorTitle}</b><br>${t.ngErrorDesc}</p>
      <button class="ng-submit-btn" id="ngAgainBtn" style="margin-top:14px;">${t.ngAgain}</button>
    `;
    document.getElementById('ngAgainBtn').addEventListener('click', resetNgForm);
  }
});

function resetNgForm() {
  document.getElementById('ngMatCode').value = '';
  document.getElementById('ngNote').value = '';
  document.getElementById('ngPhotoInput').value = '';
  ngPhotoBase64 = '';
  const box = document.getElementById('ngPhotoBox');
  box.classList.remove('has-photo');
  box.innerHTML = `<div class="upload-icon">📷</div><div class="upload-hint" id="t-ng-photo-hint">${I18N[currentLang].ngPhotoHint}</div>`;
  const btn = document.getElementById('ngSubmitBtn');
  btn.disabled = false;
  btn.textContent = I18N[currentLang].ngSubmit;
  document.getElementById('ngStatus').style.display = 'none';
  document.getElementById('ngFormWrap').style.display = 'block';
}

/* ===================== 語言切換 ===================== */
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyLang();
  });
});

function applyLang() {
  const t = I18N[currentLang];
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-tab-search').textContent = t.tabSearch;
  document.getElementById('t-tab-browse').textContent = t.tabBrowse;
  document.getElementById('t-tab-ng').textContent = t.tabNg;
  document.getElementById('t-search-label').textContent = t.searchLabel;
  document.getElementById('t-hint').textContent = t.hint;
  document.getElementById('t-ng-matcode').textContent = t.ngMatCode;
  document.getElementById('t-ng-process').textContent = t.ngProcess;
  document.getElementById('t-ng-type').textContent = t.ngTypeLabel;
  document.getElementById('t-ng-note').textContent = t.ngNote;
  document.getElementById('t-ng-photo').textContent = t.ngPhoto;
  const photoHintEl = document.getElementById('t-ng-photo-hint');
  if (photoHintEl) photoHintEl.textContent = t.ngPhotoHint;
  document.getElementById('ngSubmitBtn').textContent = t.ngSubmit;
  input.placeholder = t.placeholder;
  toggle.textContent = codeTable.classList.contains('open') ? t.toggleCodesClose : t.toggleCodesOpen;
  renderCodeTable();
  populateNgProcessOptions();
  populateNgTypeOptions();
  showEmptyState();
  renderBrowse();
}

/* ===================== 初始化 ===================== */
async function init() {
  renderCodeTable();
  populateNgProcessOptions();
  populateNgTypeOptions();
  showEmptyState();
  renderBrowse();
  await loadData();
  input.disabled = false;
  renderCodeTable();
  showEmptyState();
  renderBrowse();
}
init();
</script>
